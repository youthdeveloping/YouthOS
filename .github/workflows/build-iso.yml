# - by Claude Ai
name: Build YouthOS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "auto/**"
      - "config/**"
      - "branding/**"
      - "education/**"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/build-iso.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y live-build git ca-certificates xorriso squashfs-tools desktop-file-utils

      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: |
          chmod +x auto/* config/hooks/live/*.hook.chroot config/includes.chroot/usr/local/bin/* config/includes.chroot/etc/skel/Desktop/*.desktop

      - name: Validate YouthOS source
        run: sh scripts/validate-youthos.sh

      - name: Configure
        run: lb config

      # - by Claude Ai
      - name: Add education content
        run: |
          if [ -d education ]; then
            mkdir -p config/includes.chroot/etc/skel/education
            cp -r education/. config/includes.chroot/etc/skel/education/
          fi

      # - by Claude Ai
      - name: Customize boot menu
        run: |
          cp -r /usr/share/live/build/bootloaders config/bootloaders
          for d in $(find config/bootloaders \( -name splash.png -o -name splash.svg \) -printf '%h\n' | sort -u); do
            rm -f "$d/splash.svg"
            cp branding/boot/splash.png "$d/splash.png"
          done
          grep -rl "menu title" config/bootloaders | xargs -r sed -i 's/^\([[:space:]]*\)menu title .*/\1menu title YouthOS/'
          grep -rl "Live system" config/bootloaders | xargs -r sed -i 's/Live system/YouthOS Live/g'
          grep -rlE "^timeout" config/bootloaders --include=*.cfg | xargs -r sed -i 's/^timeout .*/timeout 50/'
          find config/bootloaders -maxdepth 2 | sort | head -50

      - name: Build ISO
        run: lb build

      - name: Show result
        run: ls -lh *.iso

      - uses: actions/upload-artifact@v4
        with:
          name: youthos-iso
          path: "*.iso"
          if-no-files-found: error
          retention-days: 14

      # - by Claude Ai
      # GitHub Releases는 파일 하나가 2GB를 넘으면 올릴 수 없어, ISO를 나눠서 올린다
      - name: Split ISO for release
        run: |
          ISO=$(ls *.iso | head -n 1)
          mkdir release
          split -b 1900M -d -a 1 --numeric-suffixes=1 "$ISO" release/youthos.iso.part
          (cd release && sha256sum youthos.iso.part* > SHA256SUMS)
          ls -lh release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iso-latest
          name: YouthOS 최신 ISO (조각 파일)
          body: |
            ISO가 2GB를 넘어 조각으로 나눠 올립니다. 모든 `youthos.iso.part*` 파일을 받은 뒤 한 파일로 합치세요.

            Windows (CMD): `copy /b youthos.iso.part* youthos.iso`
            Linux/macOS: `cat youthos.iso.part* > youthos.iso`

            합친 뒤 `SHA256SUMS`와 비교하면 깨진 파일인지 확인할 수 있습니다.
          files: release/*
          prerelease: true

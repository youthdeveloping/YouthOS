name: Build YouthOS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "auto/**"
      - "config/**"
      - ".github/workflows/build-iso.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y live-build git ca-certificates xorriso squashfs-tools

      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: |
          chmod +x auto/* config/hooks/live/*.hook.chroot config/includes.chroot/usr/local/bin/*

      - name: Configure
        run: lb config

      - name: Build ISO
        run: lb build

      - name: Show result
        run: ls -lh *.iso

      - uses: actions/upload-artifact@v4
        with:
          name: youthos-iso
          path: "*.iso"
          if-no-files-found: error
          retention-days: 14

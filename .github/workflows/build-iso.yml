# - by Claude Ai
name: Build YouthOS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "auto/**"
      - "config/**"
      - "branding/**"
      - "education/**"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/build-iso.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y live-build git ca-certificates xorriso squashfs-tools desktop-file-utils

      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: |
          chmod +x auto/* config/hooks/live/*.hook.chroot config/includes.chroot/usr/local/bin/* config/includes.chroot/etc/skel/Desktop/*.desktop

      - name: Validate YouthOS source
        run: sh scripts/validate-youthos.sh

      - name: Configure
        run: lb config

      # - by Claude Ai
      - name: Add education content
        run: |
          if [ -d education ]; then
            mkdir -p config/includes.chroot/etc/skel/education
            cp -r education/. config/includes.chroot/etc/skel/education/
          fi

      # - by Claude Ai
      - name: Customize boot menu
        run: |
          cp -r /usr/share/live/build/bootloaders config/bootloaders
          for d in $(find config/bootloaders \( -name splash.png -o -name splash.svg \) -printf '%h\n' | sort -u); do
            rm -f "$d/splash.svg"
            cp branding/boot/splash.png "$d/splash.png"
          done
          grep -rl "menu title" config/bootloaders | xargs -r sed -i 's/^\([[:space:]]*\)menu title .*/\1menu title YouthOS/'
          grep -rl "Live system" config/bootloaders | xargs -r sed -i 's/Live system/YouthOS Live/g'
          grep -rlE "^timeout" config/bootloaders --include=*.cfg | xargs -r sed -i 's/^timeout .*/timeout 50/'
          find config/bootloaders -maxdepth 2 | sort | head -50

      - name: Build ISO
        run: lb build

      - name: Show result
        run: ls -lh *.iso

      - uses: actions/upload-artifact@v4
        with:
          name: youthos-iso
          path: "*.iso"
          if-no-files-found: error
          retention-days: 14
